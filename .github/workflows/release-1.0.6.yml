name: Publish verified v1.0.6

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.0.6.yml'
    tags:
      - 'v1.0.6'

permissions:
  contents: write

concurrency:
  group: release-v1.0.6
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fulkawa/fulklink'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/v1.0.6
          persist-credentials: false
      - name: Download and verify tested package
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.0.6'
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --max-time 120 \
            'https://lp.fulkteam.cn/releases/fulklink-open-1.0.6.zip' \
            --output fulklink-open-1.0.6.zip
          printf '%s  %s\n' '2dde85e517cd0da05921c0c86aabeb551bb76b29dc1320c976f2bdbbff15c316' \
            'fulklink-open-1.0.6.zip' > fulklink-open-1.0.6.zip.sha256
          sha256sum --check fulklink-open-1.0.6.zip.sha256
          test "$(stat -c %s fulklink-open-1.0.6.zip)" = '204805'
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('.')
          manifest = json.loads((root / 'MANIFEST.json').read_text())
          assert manifest['version'] == '1.0.6' and manifest['edition'] == 'open'
          assert manifest['total_files'] == 80
          assert manifest['built_at'] == '2026-11-09T23:20:00+08:00'
          with zipfile.ZipFile('fulklink-open-1.0.6.zip') as archive:
              assert archive.read('MANIFEST.json') == (root / 'MANIFEST.json').read_bytes()
              assert archive.read('VERSION').strip() == b'1.0.6'
              for entry in manifest['files']:
                  data = archive.read(entry['path'])
                  assert len(data) == entry['bytes']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256']
                  assert data == (root / entry['path']).read_bytes()
          print('Verified package, manifest and tagged source are identical.')
          PY
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v1.0.6' --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName'; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download 'v1.0.6' --repo "$GITHUB_REPOSITORY" \
              --pattern 'fulklink-open-1.0.6.zip*' --dir "$RUNNER_TEMP/existing-release"
            cmp 'fulklink-open-1.0.6.zip' "$RUNNER_TEMP/existing-release/fulklink-open-1.0.6.zip"
            cmp 'fulklink-open-1.0.6.zip.sha256' "$RUNNER_TEMP/existing-release/fulklink-open-1.0.6.zip.sha256"
            exit 0
          fi
          gh release create 'v1.0.6' \
            'fulklink-open-1.0.6.zip' 'fulklink-open-1.0.6.zip.sha256' \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title 'FulkLink 开源版 1.0.6 — 安全修复 + 商用/私用产品线（在线升级已恢复）' \
            --notes '本版恢复在线升级：1.0.4 及以上客户站登录后台 /admin/update 检查更新即可在线升级（本版未修改 app/Migrator.php 与 database/，旧版更新器闸门放行）。1.0.3 及更早仍需手工升级。

          安全修复：云端公钥验签不再回退到本站自己的授权公钥（旧逻辑会让全新部署的商业版客户首次激活死锁，只认已钉住或 HTTPS 现取并钉住的云端公钥）；易支付查单商户密钥改走 POST body，不再出现在 URL。

          产品线：私用版（仅内部使用）与商业版（含对外落地页能力 landing.public）两种价格体系；落地页由真实授权档位驱动，四套差异化首页；客户站落地页绝不出现发行方定价。云端新增授权登记接口（令牌鉴权、幂等），发行方发码/续期后授权自动可查。

          其他：续费失败订单改记 failed 不计入营收；开源包不再注入 EDITION_FORCE。

          可复现构建：SOURCE_DATE_EPOCH=1794237600（2026-11-09 23:20:00 +0800），同参数两次构建 SHA 一致。80 个文件与 v1.0.6 标签源码逐字节一致。

          隔离验收：PHP 8.2 全量 php -l 154/0；核心回归 100/0/0（真实包参数）、发包协议 38/0、企业版全链路 84/0、PHP 运行时边界 31/31、mayuan 运行时边界 30/30、冒烟 46/46、静态断言 50/50。

          已验证安装包：204805 字节
          SHA-256：2dde85e517cd0da05921c0c86aabeb551bb76b29dc1320c976f2bdbbff15c316

          完整清单见 CHANGELOG.md。' \
            --latest
