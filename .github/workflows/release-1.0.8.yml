name: Publish verified v1.0.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.0.8.yml'
    tags:
      - 'v1.0.8'

permissions:
  contents: write

concurrency:
  group: release-v1.0.8
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fulkawa/fulklink'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/v1.0.8
          persist-credentials: false
      - name: Download and verify tested package
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.0.8'
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --max-time 120 \
            'https://lp.fulkteam.cn/releases/fulklink-open-1.0.8.zip' \
            --output fulklink-open-1.0.8.zip
          printf '%s  %s\n' '8a92b60b6048776b5d1e9a4e9f2d9bd1aad17a81ea5a032ec7106a76e6a61ccd' \
            'fulklink-open-1.0.8.zip' > fulklink-open-1.0.8.zip.sha256
          sha256sum --check fulklink-open-1.0.8.zip.sha256
          test "$(stat -c %s fulklink-open-1.0.8.zip)" = '205566'
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('.')
          manifest = json.loads((root / 'MANIFEST.json').read_text())
          assert manifest['version'] == '1.0.8' and manifest['edition'] == 'open'
          assert manifest['total_files'] == 80
          assert manifest['built_at'] == '2026-11-14T00:00:00+08:00'
          with zipfile.ZipFile('fulklink-open-1.0.8.zip') as archive:
              assert archive.read('MANIFEST.json') == (root / 'MANIFEST.json').read_bytes()
              assert archive.read('VERSION').strip() == b'1.0.8'
              for entry in manifest['files']:
                  data = archive.read(entry['path'])
                  assert len(data) == entry['bytes']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256']
                  assert data == (root / entry['path']).read_bytes()
          print('Verified package, manifest and tagged source are identical.')
          PY
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v1.0.8' --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName'; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download 'v1.0.8' --repo "$GITHUB_REPOSITORY" \
              --pattern 'fulklink-open-1.0.8.zip*' --dir "$RUNNER_TEMP/existing-release"
            cmp 'fulklink-open-1.0.8.zip' "$RUNNER_TEMP/existing-release/fulklink-open-1.0.8.zip"
            cmp 'fulklink-open-1.0.8.zip.sha256' "$RUNNER_TEMP/existing-release/fulklink-open-1.0.8.zip.sha256"
            exit 0
          fi
          gh release create 'v1.0.8' \
            'fulklink-open-1.0.8.zip' 'fulklink-open-1.0.8.zip.sha256' \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title 'FulkLink 开源版 1.0.8 — 演示站入口与登录体验修复' \
            --notes '本版修复三个体验问题：

          演示站入口此前指向商业版落地页（另一个卖源码的页面），访客点「打开演示站」看不到短链工具本身。现改为私用版演示站，登录后即可真建短链、看统计。

          新增 DEMO_ACCOUNT（默认关闭）：官方演示站登录页显示演示账号并支持一键填入；客户站不配置即无此行为，切勿开启。

          官网定价页如实说明「注册并登录后下单」，补齐交付内容、售后范围与响应时效、退款与客诉渠道；修复下单表单校验失败时引用已移除变量的告警。

          迁移器与更新器无变更，1.0.4 及以上客户站登录后台 /admin/update 检查更新即可在线升级。

          可复现构建：SOURCE_DATE_EPOCH=1794585600（2026-11-14 00:00:00 +0800），同参数两次构建 SHA 一致。80 个文件与 v1.0.8 标签源码逐字节一致。

          隔离验收：PHP 8.2 全量 php -l 154/0；核心回归 100/0/0（真实包参数）、发包协议 38/0、企业版全链路 84/0、静态断言 50/50。

          已验证安装包：205566 字节
          SHA-256：8a92b60b6048776b5d1e9a4e9f2d9bd1aad17a81ea5a032ec7106a76e6a61ccd

          完整清单见 CHANGELOG.md。' \
            --latest
