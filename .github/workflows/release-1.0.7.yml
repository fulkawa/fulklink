name: Publish verified v1.0.7

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.0.7.yml'
    tags:
      - 'v1.0.7'

permissions:
  contents: write

concurrency:
  group: release-v1.0.7
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fulkawa/fulklink'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/v1.0.7
          persist-credentials: false
      - name: Download and verify tested package
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.0.7'
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 --max-time 120 \
            'https://lp.fulkteam.cn/releases/fulklink-open-1.0.7.zip' \
            --output fulklink-open-1.0.7.zip
          printf '%s  %s\n' 'e446bcbae3e38cab5d118bcbd2c19f514ac82e89456db2c62cf6ee19612f6b9b' \
            'fulklink-open-1.0.7.zip' > fulklink-open-1.0.7.zip.sha256
          sha256sum --check fulklink-open-1.0.7.zip.sha256
          test "$(stat -c %s fulklink-open-1.0.7.zip)" = '204699'
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('.')
          manifest = json.loads((root / 'MANIFEST.json').read_text())
          assert manifest['version'] == '1.0.7' and manifest['edition'] == 'open'
          assert manifest['total_files'] == 80
          assert manifest['built_at'] == '2026-11-10T01:20:00+08:00'
          with zipfile.ZipFile('fulklink-open-1.0.7.zip') as archive:
              assert archive.read('MANIFEST.json') == (root / 'MANIFEST.json').read_bytes()
              assert archive.read('VERSION').strip() == b'1.0.7'
              for entry in manifest['files']:
                  data = archive.read(entry['path'])
                  assert len(data) == entry['bytes']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256']
                  assert data == (root / entry['path']).read_bytes()
          print('Verified package, manifest and tagged source are identical.')
          PY
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 'v1.0.7' --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName'; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download 'v1.0.7' --repo "$GITHUB_REPOSITORY" \
              --pattern 'fulklink-open-1.0.7.zip*' --dir "$RUNNER_TEMP/existing-release"
            cmp 'fulklink-open-1.0.7.zip' "$RUNNER_TEMP/existing-release/fulklink-open-1.0.7.zip"
            cmp 'fulklink-open-1.0.7.zip.sha256' "$RUNNER_TEMP/existing-release/fulklink-open-1.0.7.zip.sha256"
            exit 0
          fi
          gh release create 'v1.0.7' \
            'fulklink-open-1.0.7.zip' 'fulklink-open-1.0.7.zip.sha256' \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title 'FulkLink 开源版 1.0.7 — 移除实名认证子系统（正式运营化）' \
            --notes '本版整体移除遗留自旧产品线的实名认证子系统（与短链业务无关）：用户中心认证页、支付宝人脸核身、后台认证审核与设置页实名配置全部拆除。购买不再被认证门槛拦截——此前人脸未配置且人工审核关闭时，付费下单会被整条卡死。

          隐私政策同步移除实名信息收集条款。数据库层与迁移器无变更，1.0.4 及以上客户站登录后台 /admin/update 检查更新即可在线升级。

          可复现构建：SOURCE_DATE_EPOCH=1794244800（2026-11-10 01:20:00 +0800），同参数两次构建 SHA 一致。80 个文件与 v1.0.7 标签源码逐字节一致。

          隔离验收：PHP 8.2 全量 php -l 0 错误；核心回归 100/0/0（真实包参数）、发包协议 38/0、企业版全链路 84/0、PHP 运行时边界 31/31、冒烟 46/46、静态断言 50/50。

          已验证安装包：204699 字节
          SHA-256：e446bcbae3e38cab5d118bcbd2c19f514ac82e89456db2c62cf6ee19612f6b9b

          完整清单见 CHANGELOG.md。' \
            --latest
